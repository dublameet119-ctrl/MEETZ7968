
# RDP Setup - Remote Desktop Server

A simple automated setup project for creating a remote desktop environment on a Linux VPS.

## Features
- XFCE Desktop Environment
- XRDP Remote Desktop Server
- Secure RDP login
- Easy installation
- Ubuntu/Debian support

## Requirements
- Ubuntu 22.04 / 24.04
- Minimum 2 GB RAM recommended
- Root or sudo access
- Public IP address
- Open TCP port 3389

## Installation

Update system:

```bash
sudo apt update && sudo apt upgrade -y
```

Install desktop environment:

```bash
sudo apt install xfce4 xfce4-goodies xrdp -y
```

Enable XRDP:

```bash
sudo systemctl enable xrdp
sudo systemctl start xrdp
```

Set desktop session:

```bash
echo "startxfce4" > ~/.xsession
```

Configure firewall:

```bash
sudo ufw allow 3389/tcp
```

Restart XRDP:

```bash
sudo systemctl restart xrdp
```

## Connect Using RDP

1. Open Remote Desktop Connection on Windows.
2. Enter your VPS public IP.
3. Enter your Linux username and password.
4. Connect.

## Security
- Use a strong password.
- Restrict RDP access to trusted IP addresses.
- Avoid exposing port 3389 publicly.
- Use a VPN or secure tunnel where possible.

